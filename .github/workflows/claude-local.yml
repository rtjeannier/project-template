name: Claude Code Runner

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only run on self-hosted runner (your PC or cloud VM)
    runs-on: self-hosted

    # Security: Only respond to comments from authorized user
    if: |
      contains(github.event.comment.body || github.event.review.body, '@claude-code') &&
      (github.event.comment.user.login == 'rtjeannier' || github.event.review.user.login == 'rtjeannier')

    steps:
      - name: Determine context (issue vs PR)
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if this is a PR review event
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr_branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "Triggered from PR review on PR #${{ github.event.pull_request.number }}"
          # Check if issue_comment is on a PR (issues have pull_request property if they're PRs)
          elif [[ -n "${{ github.event.issue.pull_request }}" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            # Get PR branch name via API
            PR_BRANCH=$(gh pr view ${{ github.event.issue.number }} --json headRefName -q '.headRefName')
            echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
            echo "Triggered from comment on PR #${{ github.event.issue.number }}, branch: $PR_BRANCH"
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "pr_branch=" >> $GITHUB_OUTPUT
            echo "Triggered from issue #${{ github.event.issue.number }}"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout PR branch if on a PR, otherwise main
          ref: ${{ steps.context.outputs.is_pr == 'true' && steps.context.outputs.pr_branch || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Claude Code"
          git config user.email "claude-code@users.noreply.github.com"

      - name: Extract task from comment
        id: extract
        run: |
          COMMENT="${{ github.event.comment.body || github.event.review.body }}"
          # Remove the @claude-code trigger and trim
          TASK=$(echo "$COMMENT" | sed 's/@claude-code//g' | xargs)
          echo "task=$TASK" >> $GITHUB_OUTPUT
          echo "Task extracted: $TASK"

      - name: Run Claude Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Navigate to workspace
          cd $GITHUB_WORKSPACE

          # Run Claude Code with the extracted task
          # The -p flag runs in non-interactive mode
          claude -p "${{ steps.extract.outputs.task }}"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes to PR branch
        if: steps.changes.outputs.has_changes == 'true' && steps.context.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git commit -m "fix: Claude Code changes

          Triggered by: #${{ steps.context.outputs.pr_number }}
          Task: ${{ steps.extract.outputs.task }}"

          git push origin ${{ steps.context.outputs.pr_branch }}

      - name: Create branch and PR for issues
        if: steps.changes.outputs.has_changes == 'true' && steps.context.outputs.is_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a branch name from the issue number
          BRANCH_NAME="claude/issue-${{ github.event.issue.number }}-$(date +%s)"

          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "feat: Claude Code implementation

          Triggered by: #${{ github.event.issue.number }}
          Task: ${{ steps.extract.outputs.task }}"

          git push -u origin "$BRANCH_NAME"

          # Create PR
          gh pr create \
            --title "Claude Code: ${{ steps.extract.outputs.task }}" \
            --body "## Summary
          Automated implementation by Claude Code.

          **Triggered by:** #${{ github.event.issue.number }}
          **Task:** ${{ steps.extract.outputs.task }}

          ---
          Please review the changes and merge if satisfactory." \
            --base main

      - name: Comment on issue/PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"

          if [[ "${{ steps.changes.outputs.has_changes }}" == "true" ]]; then
            if [[ "${{ steps.context.outputs.is_pr }}" == "true" ]]; then
              gh issue comment $ISSUE_NUMBER \
                --body "I've pushed the requested changes to this PR. Please review!"
            else
              gh issue comment $ISSUE_NUMBER \
                --body "I've created a PR with the requested changes. Please review!"
            fi
          else
            gh issue comment $ISSUE_NUMBER \
              --body "I've completed the task but there were no code changes to commit."
          fi
