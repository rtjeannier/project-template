version: '3.8'

services:
  runner:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: claude-runner
    restart: unless-stopped
    environment:
      # These can be overridden in .env file
      - RUNNER_NAME=${RUNNER_NAME:-claude-runner}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
    volumes:
      # Persist authentication and runner config
      - claude-config:/home/runner/.claude
      - gh-config:/home/runner/.config/gh
      - runner-config:/home/runner
      # Mount workspace for the project
      - ./:/home/runner/work
    working_dir: /home/runner/work
    # Start runner if configured, otherwise just stay alive
    command: >
      bash -c "
        if [ -f /home/runner/.runner ]; then
          echo 'Starting GitHub Actions runner...'
          /home/runner/run.sh
        else
          echo 'Runner not configured. Run: docker exec -it claude-runner bash'
          echo 'Then: cd /home/runner && ./config.sh --url https://github.com/OWNER/REPO --token TOKEN'
          tail -f /dev/null
        fi
      "
    tty: true
    stdin_open: true

volumes:
  claude-config:
    name: claude-config
  gh-config:
    name: gh-config
  runner-config:
    name: runner-config
